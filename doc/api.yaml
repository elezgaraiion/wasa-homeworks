openapi: 3.0.3
info:
  title: WASAText API
  description: >
    API for the **WASAText** messaging application, which allows users to send and receive 
    individual or group messages with support for text, photos, and reactions.  
    Includes simplified login, user management, conversations, messages, and group handling.
  version: 1.0.0
security:
  - BearerAuth: []

components:
  schemas:

    User:
      type: object
      description: Represents an application user
      properties:
        id:
          type: string
          example: "user123"
        name:
          type: string
          example: "Maria"
        photo:
          type: string
          format: uri
          example: "https://example.com/maria.jpg"

    Conversation:
      type: object
      description: Represents a conversation (direct or group)
      properties:
        id:
          type: string
          example: "conv123"
        type:
          type: string
          enum: [direct, group]
          example: "group"
        name:
          type: string
          example: "Amigos del trabajo"
        photo:
          type: string
          format: uri
          example: "https://example.com/group-photo.jpg"
        lastMessagePreview:
          type: string
          example: "¿Nos vemos mañana?"
        lastMessageAt:
          type: string
          format: date-time
          example: "2025-11-04T20:00:00Z"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"

    Message:
      type: object
      description: Represents a message sent in a conversation
      properties:
        id:
          type: string
          example: "msg001"
        sender:
          $ref: "#/components/schemas/User"
        conversationId:
          type: string
          example: "conv123"
        text:
          type: string
          example: "Hola 👋"
        photo:
          type: string
          format: uri
          example: "https://example.com/image.jpg"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-04T10:30:00Z"
        forwardedFrom:
          type: object
          description: Information about the original message if this message was forwarded
          properties:
            conversationId:
              type: string
              example: "conv456"
            messageId:
              type: string
              example: "msg999"

paths:
  /session:
    post:
      summary: Logs in or registers the user
      description: >
        Simplified login:  
        If the username exists, the user is logged in.  
        If not, a new user is created and logged in.  
        Usernames must contain only letters (no digits or symbols) and be 3–16 characters long.
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Maria"
                  pattern: '^[A-Za-zÀ-ÿ]{3,16}$'
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: User logged in or created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
        '400':
          description: Invalid username format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Username must be 3–16 letters, without numbers or symbols."
        '409':
          description: Username already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This username is already taken."

  /me/username:
    put:
      summary: Updates the current user's name
      description: >
        Changes the name of the authenticated user.  
        The new name must be unique, only contain letters, and have 3–16 characters.
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "María López"
                  pattern: '^[A-Za-zÀ-ÿ]{3,16}$'
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Invalid name format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Name must be 3–16 letters and cannot include symbols or digits."
        '401':
          description: Unauthorized – authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid token."
        '409':
          description: Conflict – name already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This name is already taken."
  /me/photo:
    put:
      summary: Updates the current user's profile photo
      operationId: setMyPhoto
      responses:
  /users:
  get:
    summary: List all users or search by name
    operationId: listUsers
    parameters:
      - name: q
        in: query
        description: Optional search string
        required: false
        schema:
          type: string
    responses:
      '200':
        description: List of users
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
  /conversations:
    get:
      summary: Retrieves all conversations of the user
      operationId: getMyConversations
      responses:
  /conversations/{conversationId}:
    get:
      summary: Retrieves a specific conversation
      operationId: getConversation
      responses:
  /conversations/{conversationId}/messages:
    post:
      summary: Sends a new message
      operationId: sendMessage
      responses:
  /conversations/{conversationId}/messages/{messageId}/reactions: 
    post:
      summary: Adds a reaction (comment) on a existing message
      operationId: commentMessage
      responses:
    delete:
      summary: Removes a reaction (comment) from a message
      operationId: uncommentMessage
      responses:
  /conversations/{conversationId}/messages/{messageId}:
    post:
      summary: Forwards one of my messages to another conversation
      operationId: forwardMessage
      responses:
    delete:
      summary: Deletes a sent message
      operationId: deleteMessage
      responses:
  /groups/{groupId}/users:
    post:
      summary: Adds a user to the group
      operationId: addToGroup
      responses:
    delete:
      summary: Leaves the group
      operationId: leaveGroup
      responses:
  /groups/{groupId}/name:
    put:
      summary: Changes the group name
      operationId: setGroupName
      responses:
  /groups/{groupId}/photo:
    put:
      summary: Updates the group photo
      operationId: setGroupPhoto
      responses:

  

