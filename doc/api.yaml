openapi: 3.0.3
info:
  title: WASAText API
  description: >
    API for the **WASAText** messaging application, which allows users to send and receive 
    individual or group messages with support for text, photos, and reactions.  
    Includes simplified login, user management, conversations, messages, and group handling.
  version: 1.0.0

security:
  - bearerAuth: []

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "user-id"

  #-----------------------------------------------
  # Shared Schemas
  #-----------------------------------------------

  schemas:

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "An error occurred."

    User:
      type: object
      description: Represents an application user
      properties:
        id:
          type: string
          example: "user123"
        name:
          type: string
          example: "Maria"
        photo:
          type: string
          format: uri
          example: "https://example.com/maria.jpg"
      required: [id, name]

    Conversation:
      type: object
      description: Represents a conversation (direct or group)
      properties:
        id:
          type: string
          example: "conv123"
        type:
          type: string
          enum: [direct, group]
          example: "group"
        name:
          type: string
          example: "Work Friends"
        photo:
          type: string
          format: uri
          example: "https://example.com/group-photo.jpg"
        lastMessagePreview:
          type: string
          example: "See you tomorrow?"
        lastMessageAt:
          type: string
          format: date-time
          example: "2025-11-04T20:00:00Z"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required: [id, type, participants]

    Reaction:
      type: object
      properties:
        id:
          type: string
          example: "react789"
        user:
          $ref: "#/components/schemas/User"
        emoji:
          type: string
          example: "😂"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-08T15:00:00Z"
      required: [id, user, emoji, createdAt]

    Message:
      type: object
      description: Represents a message sent in a conversation
      properties:
        id:
          type: string
          example: "msg001"
        sender:
          $ref: "#/components/schemas/User"
        conversationId:
          type: string
          example: "conv123"
        text:
          type: string
          example: "Hello 👋"
        photo:
          type: string
          format: uri
          example: "https://example.com/image.jpg"
        replyToMessageId:
          type: string
          example: "msg000"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-04T10:30:00Z"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
        status:
          type: string
          enum: [delivered, read]
          example: "read"
          description: >
            Message status:
            - delivered: received by all recipients
            - read: read by all recipients
      required: [id, sender, conversationId, createdAt, status]

  #-----------------------------------------------
  # Shared Parameters
  #-----------------------------------------------

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation ID
      schema:
        type: string
        example: "conv123"

    MessageId:
      name: messageId
      in: path
      required: true
      description: Message ID
      schema:
        type: string
        example: "msg001"

    GroupId:
      name: groupId
      in: path
      required: true
      description: Group ID
      schema:
        type: string
        example: "group123"

    ReactionId:
      name: reactionId
      in: path
      required: true
      description: Reaction ID
      schema:
        type: string
        example: "react789"

  #-----------------------------------------------
  # Shared Error Responses
  #-----------------------------------------------

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

#-----------------------------------------------
# Paths
#-----------------------------------------------

paths:

  /session:
    post:
      summary: Log in or register
      security: []
      description: >
        Simplified login:  
        If the username exists, the user is logged in.  
        If not, a new user is created and logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Maria"
                  pattern: '^[A-Za-zÀ-ÿ]{3,16}$'
              required: [name]
      responses:
        '201':
          description: User logged in or created
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
        '400':
          $ref: "#/components/responses/BadRequest"

  /me/username:
    put:
      summary: Update user name
      description: Change authenticated user's name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Maria Lopez"
              required: [name]
      responses:
        '200':
          description: Username updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '409':
          $ref: "#/components/responses/Conflict"

  /me/photo:
    put:
      summary: Update profile photo
      description: Upload and set a new profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      summary: List or search users
      parameters:
        - name: q
          in: query
          description: Optional search string
          required: false
          schema:
            type: string
            pattern: '^[A-Za-zÀ-ÿ ]{0,32}$'
            example: "Maria"
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"

  /conversations:
    get:
      summary: List user conversations
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        '401':
          $ref: "#/components/responses/Unauthorized"

  /conversations/{conversationId}:
    get:
      summary: Get a specific conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"

    get:
      summary: List messages in conversation
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Messages retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

    post:
      summary: Send new message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  example: "Hello everyone"
                photoUrl:
                  type: string
                  format: uri
                  example: "https://example.com/pic.jpg"
                replyToMessageId:
                  type: string
                  example: "msg000"
              anyOf:
                - required: ["text"]
                - required: ["photoUrl"]
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"

    post:
      summary: Forward a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetConversationId:
                  type: string
                  example: "conv456"
              required: [targetConversationId]
      responses:
        '201':
          description: Message forwarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete a sent message
      responses:
        '204':
          description: Message deleted
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  /conversations/{conversationId}/messages/{messageId}/reactions:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"

    post:
      summary: Add a reaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  example: "👍"
              required: [emoji]
      responses:
        '201':
          description: Reaction added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  /conversations/{conversationId}/messages/{messageId}/reactions/{reactionId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
      - $ref: "#/components/parameters/ReactionId"

    delete:
      summary: Remove a reaction
      responses:
        '204':
          description: Reaction removed
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  /groups:
    post:
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Work Friends"
                users:
                  type: array
                  items:
                    type: string
                  example: ["user123", "user456"]
              required: [name]
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"

  /groups/{groupId}/users:
    parameters:
      - $ref: "#/components/parameters/GroupId"

    post:
      summary: Add user to group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  example: "user789"
              required: [userId]
      responses:
        '200':
          description: User added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Leave group
      responses:
        '204':
          description: Left group
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"

  /groups/{groupId}/name:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    put:
      summary: Change group name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "New Group Name"
              required: [name]
      responses:
        '200':
          description: Name changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  /groups/{groupId}/photo:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    put:
      summary: Update group photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
