openapi: 3.0.3
info:
  title: WASAText API
  description: >
    API for the **WASAText** messaging application, which allows users to send and receive 
    individual or group messages with support for text, photos, and reactions.  
    Includes simplified login, user management, conversations, messages, and group handling.
  version: 1.0.0
security:
  - bearerAuth: []

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "user-id"

  schemas:

    User:
      type: object
      description: Represents an application user
      properties:
        id:
          type: string
          example: "user123"
        name:
          type: string
          example: "Maria"
        photo:
          type: string
          format: uri
          example: "https://example.com/maria.jpg"
      required:
        - id
        - name

    Conversation:
      type: object
      description: Represents a conversation (direct or group)
      properties:
        id:
          type: string
          example: "conv123"
        type:
          type: string
          enum: [direct, group]
          example: "group"
        name:
          type: string
          example: "Amigos del trabajo"
        photo:
          type: string
          format: uri
          example: "https://example.com/group-photo.jpg"
        lastMessagePreview:
          type: string
          example: "¿Nos vemos mañana?"
        lastMessageAt:
          type: string
          format: date-time
          example: "2025-11-04T20:00:00Z"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required:
        - id
        - type
        - participants

    Reaction:
      type: object
      properties:
        id:
          type: string
          example: "react789"
        user:
          $ref: "#/components/schemas/User"
        emoji:
          type: string
          example: "😂"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-08T15:00:00Z"
      required:
        - id
        - user
        - emoji
        - createdAt

    Message:
      type: object
      description: Represents a message sent in a conversation
      properties:
        id:
          type: string
          example: "msg001"
        sender:
          $ref: "#/components/schemas/User"
        conversationId:
          type: string
          example: "conv123"
        text:
          type: string
          example: "Hola 👋"
        photo:
          type: string
          format: uri
          example: "https://example.com/image.jpg"
        replyToMessageId:
          type: string
          example: "msg000"
          description: "If present, this message is a reply to another message"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-04T10:30:00Z"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
        status:
          type: string
          enum: [delivered, read]
          example: "read"
          description: >
            Message status:
            - delivered: received by all recipients (appears in their conversation list)
            - read: read by all recipients within the conversation
      required:
        - id
        - sender
        - conversationId
        - createdAt
        - status

  parameters:
    ConversationIdParam:
      name: conversationId
      in: path
      required: true
      description: Unique identifier of the conversation
      schema:
        type: string
        example: "conv123"
    MessageIdParam:
      name: messageId
      in: path
      required: true
      description: Unique identifier of the message
      schema:
        type: string
        example: "msg001"
    GroupIdParam:
      name: groupId
      in: path
      required: true
      description: Unique identifier of the group (conversation of type group)
      schema:
        type: string
        example: "group123"
    ReactionIdParam:
      name: reactionId
      in: path
      required: true
      description: Unique identifier of the reaction
      schema:
        type: string
        example: "react789"
paths:
  /session:
    post:
      summary: Logs in or registers the user
      security: []
      description: >
        Simplified login:  
        If the username exists, the user is logged in.  
        If not, a new user is created and logged in.  
        Usernames must contain only letters (no digits or symbols) and be 3–16 characters long.
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Maria"
                  pattern: '^[A-Za-zÀ-ÿ]{3,16}$'
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: User logged in or created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
        '400':
          description: Invalid username format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Username must be 3–16 letters, without numbers or symbols."
        '409':
          description: Username already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This username is already taken."

  /me/username:
    put:
      summary: Updates the current user's name
      description: >
        Changes the name of the authenticated user.  
        The new name must be unique, only contain letters, and have 3–16 characters.
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "María"
                  pattern: '^[A-Za-zÀ-ÿ]{3,16}$'
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Invalid name format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Name must be 3–16 letters and cannot include symbols or digits."
        '401':
          description: Unauthorized – authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid token."
        '409':
          description: Conflict – name already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This name is already taken."
  /me/photo:
    put:
      summary: Updates the current user's profile photo
      description: >
        Uploads and sets a new profile photo for the authenticated user.  
        The request must include a valid image file (e.g., JPEG, PNG, or GIF).
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: The new profile image file.
      responses:
        '200':
          description: Photo updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Bad request – missing or invalid file
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing photo file."
        '401':
          description: Unauthorized – authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid token."
        '415':
          description: Unsupported media type – only images allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unsupported image format. Allowed types: JPG, PNG, GIF."
  /users:
    get:
      summary: List all users or search by name
      description: >
        Retrieves all registered users, or filters them by name using the optional query parameter `q`.  
        Returns an empty list if no users match.
      operationId: listUsers
      parameters:
        - name: q
          in: query
          description: Optional search string (letters only)
          required: false
          schema:
            type: string
            pattern: '^[A-Za-zÀ-ÿ]{0,16}$'
            example: "Maria"
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        '400':
          description: Invalid search parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid search query. Only letters are allowed."
        '401':
          description: Unauthorized – authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid token."
  /conversations:
    get:
      summary: Retrieves all conversations of the user
      description: >
        Returns all conversations (direct or group) for the authenticated user,  
        sorted by the date of the last message in reverse chronological order.
      operationId: getMyConversations
      responses:
        '200':
          description: List of conversations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        '401':
          description: Unauthorized – authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid token."
  /conversations/{conversationId}:
    get:
      summary: Retrieves a specific conversation
      description: >
        Returns the details of a specific conversation, including participants and the latest message preview.  
        The user must be a participant of the conversation to access it.
      operationId: getConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Unique identifier of the conversation
          schema:
            type: string
            example: "conv123"
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '401':
          description: Unauthorized – authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid token."
        '403':
          description: Forbidden – user is not a participant in the conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Access denied. You are not a participant in this conversation."
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Conversation not found."
  /conversations/{conversationId}/messages:
    post:
      summary: Adds a reaction (comment) on a existing message
      operationId: commentMessage
      responses:
    delete:
      summary: Removes a reaction (comment) from a message
      operationId: uncommentMessage
      responses:
  /conversations/{conversationId}/messages/{messageId}:
    post:
      summary: Forwards one of my messages to another conversation
      operationId: forwardMessage
      responses:
    delete:
      summary: Deletes a sent message
      operationId: deleteMessage
      responses:
  /groups:
    post:
      summary: Creates a new group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Amigos del trabajo"
                users:
                  type: array
                  items:
                    type: string
                  example: ["user123", "user456"]
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /groups/{groupId}/users:
    post:
      summary: Adds a user to the group
      operationId: addToGroup
      responses:
    delete:
      summary: Leaves the group
      operationId: leaveGroup
      responses:
  /groups/{groupId}/name:
    put:
      summary: Changes the group name
      operationId: setGroupName
      responses:
  /groups/{groupId}/photo:
    put:
      summary: Updates the group photo
      operationId: setGroupPhoto
      responses:

  

